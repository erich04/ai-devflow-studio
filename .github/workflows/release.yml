name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

jobs:
  windows-compatibility:
    name: Windows compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm test:cross-platform

  postgres-integration:
    name: Postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: devflow_release
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devflow_release"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEVFLOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/devflow_release
      DEVFLOW_PACKAGED_SMOKE_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/devflow_release
      DEVFLOW_PACKAGED_SMOKE_NETWORK_MODE: offline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:postgres-smoke
      - run: corepack pnpm test:v15-github-delivery
      - run: node scripts/ensure-electron-install.mjs
      - run: corepack pnpm build:desktop-pilot
      - name: Install the ephemeral Linux credential service
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-x11 gnome-keyring libsecret-1-0
      - run: dbus-run-session -- node scripts/run-v15-packaged-smoke-linux.mjs

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:docker-smoke

  docker-lifecycle-smoke:
    name: Docker lifecycle smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable
      - run: corepack pnpm test:docker-lifecycle-smoke

  release-artifacts:
    name: Build release artifacts
    runs-on: macos-latest
    needs:
      - windows-compatibility
      - postgres-integration
      - docker-smoke
      - docker-lifecycle-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact signoff checkout
        shell: bash
        run: |
          set -euo pipefail
          TARGET_VERSION="$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_REF}" != "refs/tags/v${TARGET_VERSION}" ]]; then
            echo "Manual Release dispatch must use the annotated version tag ref." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/v${TARGET_VERSION}")" != tag ]]; then
            echo "Release tag must be annotated." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "v${TARGET_VERSION}^{commit}")"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: node scripts/ensure-electron-install.mjs
      - run: corepack pnpm exec playwright install chromium
      - run: corepack pnpm verify
      - run: corepack pnpm build
      - run: corepack pnpm test:build-output-smoke
      - run: corepack pnpm test:e2e
      - run: corepack pnpm test:electron-smoke
      - run: corepack pnpm build:desktop-pilot
      - run: corepack pnpm test:desktop-pilot-smoke

      - name: Validate recorded Verify run against GitHub
        id: recorded-verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/validate-release-verify-run.mjs docs/releases/v1.5.0/required-gates.json

      - uses: actions/download-artifact@v4
        with:
          name: ai-devflow-studio-v15-candidate-desktop
          path: out/release-candidate-desktop
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.recorded-verify.outputs.run-id }}

      - name: Verify exact candidate Desktop artifact trio
        run: node scripts/desktop-artifact-trio.mjs verify out/release-candidate-desktop/artifact-index.json --exclusive

      - name: Verify candidate-bound release signoff
        env:
          DEVFLOW_RELEASE_DESKTOP_ARTIFACT_INDEX: out/release-candidate-desktop/artifact-index.json
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            corepack pnpm release:status -- --mode=tagged
          else
            corepack pnpm release:status -- --mode=pre-tag
          fi

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/desktop-artifact-trio.mjs stage out/release-candidate-desktop/artifact-index.json release-artifacts --exclusive-source
          VERSION="$(node scripts/release-artifact-label.mjs)"
          {
            echo "AI DevFlow Studio ${VERSION}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Artifacts:"
            echo "- desktop-pilot: exact-SHA Verify archive plus integrity manifest"
            echo "- web-next-build: apps/web/.next"
            echo "- api-build: apps/api/dist"
            echo "- worker-build: apps/worker/dist"
          } > release-artifacts/manifest.txt
          tar -czf "release-artifacts/ai-devflow-studio-${VERSION}-web-next-build.tar.gz" -C apps/web .next
          tar -czf "release-artifacts/ai-devflow-studio-${VERSION}-api-build.tar.gz" -C apps/api dist
          tar -czf "release-artifacts/ai-devflow-studio-${VERSION}-worker-build.tar.gz" -C apps/worker dist
          EXPECTED_FILE_COUNT=7
          test "$(find release-artifacts -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "${EXPECTED_FILE_COUNT}"
          test "$(find release-artifacts -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = "${EXPECTED_FILE_COUNT}"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-devflow-studio-release-artifacts
          path: release-artifacts/
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - release-artifacts
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify remote tag and publish exact current-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != "refs/tags/${TAG}" ]]; then
            echo "Release publishing requires an exact tag ref." >&2
            exit 1
          fi
          REF_ROW="$(gh api -H "Accept: application/vnd.github+json" "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '[.ref, .object.type, .object.sha] | @tsv')"
          IFS=$'\t' read -r REMOTE_REF TAG_OBJECT_TYPE TAG_OBJECT_SHA <<< "${REF_ROW}"
          if [[ "${REMOTE_REF}" != "${GITHUB_REF}" || "${TAG_OBJECT_TYPE}" != "tag" ]]; then
            echo "Remote release ref must resolve to an annotated tag object." >&2
            exit 1
          fi
          TAG_ROW="$(gh api -H "Accept: application/vnd.github+json" "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" --jq '[.tag, .object.type, .object.sha] | @tsv')"
          IFS=$'\t' read -r REMOTE_TAG TARGET_TYPE PEELED_SHA <<< "${TAG_ROW}"
          if [[ "${REMOTE_TAG}" != "${TAG}" || "${TARGET_TYPE}" != "commit" || "${PEELED_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "Remote annotated tag does not peel to the signed-off commit." >&2
            exit 1
          fi
          ARTIFACT_DIR="${RUNNER_TEMP}/devflow-release-artifacts-${GITHUB_RUN_ID}"
          mkdir "${ARTIFACT_DIR}"
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name ai-devflow-studio-release-artifacts --dir "${ARTIFACT_DIR}"
          EXPECTED_FILE_COUNT=7
          test "$(find "${ARTIFACT_DIR}" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "${EXPECTED_FILE_COUNT}"
          test "$(find "${ARTIFACT_DIR}" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = "${EXPECTED_FILE_COUNT}"
          mapfile -d '' ARTIFACTS < <(find "${ARTIFACT_DIR}" -mindepth 1 -maxdepth 1 -type f -print0 | sort -z)
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "AI DevFlow Studio ${TAG}" --notes "Automated release artifact bundle for ${TAG}. Real opencode provider smoke remains an explicit local signoff path and is not run in CI."
          fi
          gh release upload "${TAG}" "${ARTIFACTS[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
