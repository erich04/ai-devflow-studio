name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - devflow-v0.2-final-v0.3-start
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  macos-verify:
    name: macOS verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm audit:production
      - run: node scripts/ensure-electron-install.mjs
      - run: corepack pnpm exec playwright install chromium
      - run: corepack pnpm verify
      - name: V2.0 candidate-bound evaluator
        run: corepack pnpm test:v20-agent-runtime-evaluator -- --candidate-sha "${GITHUB_SHA}" --output "out/v20-evaluation/${GITHUB_SHA}.json"
      - name: V2.1 candidate-bound evaluator
        run: corepack pnpm test:v21-retrieval-memory-evaluator -- --candidate-sha "${GITHUB_SHA}" --output "out/v21-evaluation/${GITHUB_SHA}.json"
      - name: V2.2 candidate-bound evaluator
        run: corepack pnpm test:v22-multi-agent-evaluator -- --candidate-sha "${GITHUB_SHA}" --output "out/v22-evaluation/${GITHUB_SHA}.json"
      - run: corepack pnpm build
      - run: corepack pnpm test:build-output-smoke
      - run: corepack pnpm test:e2e
      - run: corepack pnpm test:electron-smoke
      - name: Native v2 compatibility in real Electron
        run: node scripts/native-coding-electron-smoke.mjs
      - name: Native v3 task, question, approval and evidence in real Electron
        run: node scripts/native-coding-electron-smoke.mjs --harness-v3
      - name: Native v3 manual acceptance without fabricated test evidence
        run: node scripts/native-coding-electron-smoke.mjs --harness-v3 --manual-acceptance
      - run: corepack pnpm build:desktop-pilot
      - run: corepack pnpm test:desktop-pilot-smoke
      - run: node scripts/desktop-artifact-trio.mjs stage out/desktop-pilot/artifact-index.json out/verify-candidate-desktop
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ai-devflow-studio-candidate-desktop
          path: out/verify-candidate-desktop/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows-compatibility:
    name: Windows compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Native v3 Windows filesystem and recovery regression
        run: corepack pnpm exec vitest run apps/desktop/electron/native-coding apps/desktop/electron/coding-candidate-workspace.test.ts apps/desktop/electron/coding-command-runner.test.ts apps/desktop/electron/coding-child-merge.test.ts apps/desktop/electron/coding-runner.test.ts apps/desktop/electron/coding-atomic-file.test.ts
      - run: node scripts/ensure-electron-install.mjs
      - name: Native v3 real Electron on Windows
        run: node scripts/native-coding-electron-smoke.mjs --harness-v3
      - run: corepack pnpm typecheck
      # Bound concurrent Git/SQLite fixtures on the shared Windows runner.
      - run: corepack pnpm run test --maxWorkers=2
      - run: corepack pnpm test:cross-platform

  native-v3-linux:
    name: Native v3 Linux lifecycle and Electron
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Real files, recovery, child sessions and process cancellation
        run: corepack pnpm exec vitest run apps/desktop/electron/native-coding apps/desktop/electron/coding-candidate-workspace.test.ts apps/desktop/electron/coding-command-runner.test.ts apps/desktop/electron/coding-child-merge.test.ts apps/desktop/electron/coding-runner.test.ts apps/desktop/electron/coding-atomic-file.test.ts
      - run: node scripts/ensure-electron-install.mjs
      - run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-1-0
      - name: Isolated CI Electron session (local synthetic model only)
        run: xvfb-run -a dbus-run-session -- node scripts/native-coding-electron-smoke.mjs --harness-v3
        env:
          DEVFLOW_CODING_SMOKE_NO_SANDBOX: 'true'
      - name: Manual acceptance in isolated Electron
        run: xvfb-run -a dbus-run-session -- node scripts/native-coding-electron-smoke.mjs --harness-v3 --manual-acceptance
        env:
          DEVFLOW_CODING_SMOKE_NO_SANDBOX: 'true'

  postgres-integration:
    name: Postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: devflow_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEVFLOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/devflow_ci
      DEVFLOW_PACKAGED_SMOKE_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/devflow_ci
      DEVFLOW_PACKAGED_SMOKE_NETWORK_MODE: offline
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:postgres-smoke
      - run: corepack pnpm test:organization-postgres
        env:
          DEVFLOW_TENANCY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/devflow_ci
      - run: corepack pnpm test:budget-postgres
        env:
          DEVFLOW_BUDGET_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/devflow_ci
      - run: corepack pnpm test:v15-github-delivery
      - run: node scripts/ensure-electron-install.mjs
      - run: corepack pnpm build:desktop-pilot
      - name: Install the ephemeral Linux credential service
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # Keep the Ubuntu mirror configured for this hosted runner.
          sudo -E timeout --signal=TERM --kill-after=10s 240s apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::ForceIPv4=true \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60
          sudo -E timeout --signal=TERM --kill-after=10s 240s apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::ForceIPv4=true \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            dbus-x11 gnome-keyring libsecret-1-0
      - run: dbus-run-session -- node scripts/run-v15-packaged-smoke-linux.mjs

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:docker-smoke
      - name: Native v3 actual pinned container execution and cancellation
        run: |
          docker pull ubuntu@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
          corepack pnpm exec vitest run scripts/native-coding-container.test.ts
        env:
          DEVFLOW_NATIVE_CONTAINER_TEST_IMAGE: ubuntu@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea

  docker-lifecycle-smoke:
    name: Docker lifecycle smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # This job installs dependencies inside Docker, so no host store exists.
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm test:docker-lifecycle-smoke
