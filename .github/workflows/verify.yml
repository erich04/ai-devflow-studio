name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - devflow-v0.2-final-v0.3-start
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  macos-verify:
    name: macOS verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm audit:production
      - run: node scripts/ensure-electron-install.mjs
      - run: corepack pnpm exec playwright install chromium
      - run: corepack pnpm verify
      - name: V2.0 candidate-bound evaluator
        run: corepack pnpm test:v20-agent-runtime-evaluator -- --candidate-sha "${GITHUB_SHA}" --output "out/v20-evaluation/${GITHUB_SHA}.json"
      - name: V2.1 candidate-bound evaluator
        run: corepack pnpm test:v21-retrieval-memory-evaluator -- --candidate-sha "${GITHUB_SHA}" --output "out/v21-evaluation/${GITHUB_SHA}.json"
      - name: V2.2 candidate-bound evaluator
        run: corepack pnpm test:v22-multi-agent-evaluator -- --candidate-sha "${GITHUB_SHA}" --output "out/v22-evaluation/${GITHUB_SHA}.json"
      - run: corepack pnpm build
      - run: corepack pnpm test:build-output-smoke
      - run: corepack pnpm test:e2e
      - run: corepack pnpm test:electron-smoke
      - run: corepack pnpm build:desktop-pilot
      - run: corepack pnpm test:desktop-pilot-smoke
      - run: node scripts/desktop-artifact-trio.mjs stage out/desktop-pilot/artifact-index.json out/verify-candidate-desktop
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ai-devflow-studio-v22-candidate-desktop
          path: out/verify-candidate-desktop/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows-compatibility:
    name: Windows compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm test:cross-platform

  postgres-integration:
    name: Postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: devflow_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEVFLOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/devflow_ci
      DEVFLOW_PACKAGED_SMOKE_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/devflow_ci
      DEVFLOW_PACKAGED_SMOKE_NETWORK_MODE: offline
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:postgres-smoke
      - run: corepack pnpm test:v15-github-delivery
      - run: node scripts/ensure-electron-install.mjs
      - run: corepack pnpm build:desktop-pilot
      - name: Install the ephemeral Linux credential service
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo -E timeout --signal=TERM --kill-after=10s 240s apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::ForceIPv4=true \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60
          sudo -E timeout --signal=TERM --kill-after=10s 240s apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::ForceIPv4=true \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            dbus-x11 gnome-keyring libsecret-1-0
      - run: dbus-run-session -- node scripts/run-v15-packaged-smoke-linux.mjs

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:docker-smoke

  docker-lifecycle-smoke:
    name: Docker lifecycle smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm test:docker-lifecycle-smoke
