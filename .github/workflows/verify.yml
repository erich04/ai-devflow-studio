name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - devflow-v0.2-final-v0.3-start
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  macos-verify:
    name: macOS verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: node scripts/ensure-electron-install.mjs
      - run: corepack pnpm exec playwright install chromium
      - run: corepack pnpm verify
      - run: corepack pnpm build
      - run: corepack pnpm test:build-output-smoke
      - run: corepack pnpm test:e2e
      - run: corepack pnpm test:electron-smoke
      - run: corepack pnpm build:desktop-pilot
      - run: corepack pnpm test:desktop-pilot-smoke
      - run: node scripts/desktop-artifact-trio.mjs stage out/desktop-pilot/artifact-index.json out/verify-candidate-desktop
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ai-devflow-studio-v15-candidate-desktop
          path: out/verify-candidate-desktop/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows-compatibility:
    name: Windows compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm test:cross-platform

  postgres-integration:
    name: Postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: devflow_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEVFLOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/devflow_ci
      DEVFLOW_PACKAGED_SMOKE_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/devflow_ci
      DEVFLOW_PACKAGED_SMOKE_NETWORK_MODE: offline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:postgres-smoke
      - run: corepack pnpm test:v15-github-delivery
      - run: node scripts/ensure-electron-install.mjs
      - run: corepack pnpm build:desktop-pilot
      - name: Install the ephemeral Linux credential service
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-x11 gnome-keyring libsecret-1-0
      - run: dbus-run-session -- node scripts/run-v15-packaged-smoke-linux.mjs

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:docker-smoke

  docker-lifecycle-smoke:
    name: Docker lifecycle smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm test:docker-lifecycle-smoke
