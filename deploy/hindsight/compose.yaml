name: devflow-hindsight

services:
  hindsight:
    # Upstream v1.0.0 / 39c65ffe2f140d0c84cee58566cad8900c5b9908 (multi-architecture digest in the
    # Dockerfile) plus a multilingual embedding model. Built locally on the first `up`, which
    # downloads the model (about 490 MB); DEVFLOW_HF_ENDPOINT may name a Hugging Face mirror.
    image: devflow-hindsight:1.0.0-multilingual-e5-small
    build:
      context: .
      args:
        HF_ENDPOINT: ${DEVFLOW_HF_ENDPOINT:-https://huggingface.co}
    restart: unless-stopped
    init: true
    shm_size: 1gb
    mem_limit: 3g
    cpus: 2
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:${DEVFLOW_HINDSIGHT_API_PORT:-8890}:8888"
      - "127.0.0.1:${DEVFLOW_HINDSIGHT_UI_PORT:-9990}:9999"
    # Docker Desktop provides this name already; the entry makes Linux Docker resolve it too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Hindsight holds no Provider credential. Its extraction and consolidation calls go to
      # DevFlow's memory relay on the host (ADR 0030), which admits each call against the paired
      # project's model budget and forwards it with the project's saved Provider. Until
      # DEVFLOW_MEMORY_RELAY_TOKEN matches the desktop's relay token, every call is refused
      # and nothing is charged.
      HINDSIGHT_API_LLM_PROVIDER: deepseek
      HINDSIGHT_API_LLM_MODEL: deepseek-flash
      HINDSIGHT_API_LLM_BASE_URL: http://host.docker.internal:${DEVFLOW_MEMORY_RELAY_PORT:-8891}/v1
      HINDSIGHT_API_LLM_API_KEY: ${DEVFLOW_MEMORY_RELAY_TOKEN:-devflow-relay-token-not-set}
      # The bank id tells the relay which project a call belongs to. The relay removes it
      # before the request leaves the machine.
      HINDSIGHT_API_LLM_SEND_BANK_AS_USER: "true"
      # The startup probe has no bank, so the relay would refuse it; skip it.
      HINDSIGHT_API_SKIP_LLM_VERIFICATION: "true"
      HINDSIGHT_API_ENABLE_BANK_CONFIG_API: "true"
      # Project memory banks consolidate observations. Repository knowledge banks turn both
      # off in their own bank configuration.
      HINDSIGHT_API_ENABLE_OBSERVATIONS: "true"
      HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION: "true"
      HINDSIGHT_API_ENABLE_BANK_LLM_HEALTH: "false"
      HINDSIGHT_API_MCP_ENABLED: "false"
      HINDSIGHT_API_WORKER_ID: devflow-hindsight-local
      HINDSIGHT_API_WORKER_MAX_SLOTS: "1"
      HINDSIGHT_API_WORKER_CONSOLIDATION_RESERVED_SLOTS: "0"
      HINDSIGHT_API_WORKER_MAX_RETRIES: "0"
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "1"
      HINDSIGHT_API_LLM_MAX_RETRIES: "0"
      # Includes the relay's budget admission round trip.
      HINDSIGHT_API_LLM_TIMEOUT: "120"
      # One vector space for Chinese and English. e5 models are trained with these prefixes.
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: /home/hindsight/models/multilingual-e5-small
      HINDSIGHT_API_EMBEDDINGS_QUERY_PREFIX: "query: "
      HINDSIGHT_API_EMBEDDINGS_PASSAGE_PREFIX: "passage: "
      # The upstream image's English cross-encoder. Repository knowledge banks rerank with it;
      # project memory banks turn reranking off (ADR 0030).
      HINDSIGHT_API_RERANKER_PROVIDER: local
      HINDSIGHT_API_RERANKER_LOCAL_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      # Both models are in the image; avoid runtime downloads.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - data-multilingual-e5-small:/home/hindsight/.pg0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8888/health',timeout=3)); assert r['status']=='healthy' and r['database']=='connected'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  # Named after the embedding model: Hindsight keeps no record of which model made a vector, so
  # one store holds one model's vectors. The English-model store (devflow-hindsight_data) is
  # left as it was; `corepack pnpm hindsight:migrate` copies its banks here.
  data-multilingual-e5-small:
